spring.application.name=audit-log-service

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auditlog}
spring.datasource.username=${DB_USERNAME:auditlog}
spring.datasource.password=${DB_PASSWORD:auditlog}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Self-provisions the audit_chain_lock table and its singleton seed row on every startup, so a
# fresh PostgreSQL database needs no manual setup. Both statements are idempotent (CREATE TABLE
# IF NOT EXISTS / INSERT ... WHERE NOT EXISTS), so running them on every restart is safe.
# Scoped to just this table - audit_event's own schema management is out of scope for this
# slice. mode=always is required because the default ("embedded") only runs SQL init against
# embedded databases like H2, not a real PostgreSQL datasource.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:chain-lock-schema.sql
spring.sql.init.data-locations=classpath:chain-lock-data.sql
