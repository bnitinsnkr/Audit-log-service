spring.application.name=audit-log-service

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auditlog}
spring.datasource.username=${DB_USERNAME:auditlog}
spring.datasource.password=${DB_PASSWORD:auditlog}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Self-provisions audit_event and audit_chain_lock (plus the lock's singleton seed row) on every
# startup, so a fresh PostgreSQL database needs no manual setup. All statements are idempotent
# (CREATE TABLE IF NOT EXISTS / ADD COLUMN IF NOT EXISTS / INSERT ... WHERE NOT EXISTS), so
# running them on every restart is safe. mode=always is required because the default
# ("embedded") only runs SQL init against embedded databases like H2, not a real PostgreSQL
# datasource. Order matters: audit-event-schema.sql must create the table before
# audit-event-scenario-b-schema.sql tries to add columns to it.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:chain-lock-schema.sql,classpath:audit-event-schema.sql,classpath:audit-event-scenario-b-schema.sql
spring.sql.init.data-locations=classpath:chain-lock-data.sql

# Scenario B soft-archive retention window (days). Events older than this become eligible for
# POST /audit/retention/archive; see SCENARIO_B.md.
audit.retention.days=90
